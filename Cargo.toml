[package]
name = "omnirelease"
version = "0.1.0"
edition = "2024"
description = "Serve GitHub Releases as APT, RPM and pacman repositories"
license = "CC0-1.0"

[dependencies]
anyhow = "1.0.104"
ar = "0.9.0"
axum = "0.8"
base64 = "0.23.1"
bytes = "1.12.2"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "env"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
humantime = "2.4.0"
humantime-serde = "1.1.1"
pgp = "0.21.1"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rpm = { version = "0.30.2", default-features = false }
rpm-version = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xz2 = { version = "0.1.7", features = ["static"] }
zstd = "0.14.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
